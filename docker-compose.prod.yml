# ============================================================
# docker-compose PRODUCTION — ERP FABS-CI V10
# Usage : docker compose -f docker-compose.prod.yml up -d
# Prérequis : .env rempli depuis .env.production.example
#             Certificats Let's Encrypt présents sur le host
# ============================================================
version: '3.8'

services:
  # ---- MongoDB ----------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: fabsci-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: fabsci_erp
    # NE PAS exposer le port MongoDB en production (accès interne uniquement)
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - fabsci-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Redis ------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fabsci-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - fabsci-network
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---- Backend API ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fabsci-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      MONGO_URL: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017
      DB_NAME: fabsci_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: INFO
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
    # NE PAS exposer le port backend directement — passe par nginx
    expose:
      - "8001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fabsci-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ---- Frontend (nginx HTTPS) --------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fabsci-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config nginx HTTPS
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificats Let's Encrypt (générer avec certbot sur le host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Répertoire ACME challenge pour renouvellement certbot
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - fabsci-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  fabsci-network:
    driver: bridge
