version: '3.9'

# Phase 3.6: Deployment Hardening
# Production Docker Compose with security best practices

services:
  # ========================================================================
  # MongoDB - Database
  # ========================================================================
  mongodb:
    image: mongo:7.0-alpine
    container_name: fabsci_mongodb
    networks:
      - backend
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: fabsci_erp
    secrets:
      - mongo_password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh -u ${MONGO_ROOT_USER:-admin} -p $$(cat /run/secrets/mongo_password) --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # ========================================================================
  # Redis - Cache & Sessions
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: fabsci_redis
    networks:
      - backend
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # ========================================================================
  # Backend - Python/FastAPI
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fabsci_backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "8002:8002"
      - "8443:8443"
    environment:
      ENVIRONMENT: production
      MONGO_URL: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/fabsci_erp?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DB_NAME: fabsci_erp
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      TLS_ENABLED: 'true'
      TLS_PORT: 8443
      TLS_CERT_PATH: /run/secrets/tls_cert
      TLS_KEY_PATH: /run/secrets/tls_key
      TLS_MTLS_ENABLED: 'false'
      TLS_LOG_LEVEL: info
      LOG_LEVEL: INFO
    secrets:
      - mongo_password
      - redis_password
      - jwt_secret
      - tls_cert
      - tls_key
      - fne_api_key
    volumes:
      - ./backend:/app/backend:ro
      - backend_logs:/app/logs
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Can restrict further
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: curl -f http://localhost:8002/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    stdin_open: false
    tty: false

  # ========================================================================
  # Frontend - Nginx
  # ========================================================================
  frontend:
    image: nginx:alpine
    container_name: fabsci_frontend
    depends_on:
      - backend
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - frontend_cache:/var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure
    stdin_open: false
    tty: false

# ============================================================================
# Networks
# ============================================================================
networks:
  backend:
    internal: true  # No external access
    driver: bridge
  frontend:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  frontend_cache:
    driver: local

# ============================================================================
# Secrets (use files in production)
# ============================================================================
secrets:
  mongo_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem
  fne_api_key:
    file: ./secrets/fne_api_key.txt

# ============================================================================
# Notes:
# - Internal network for backend services (MongoDB, Redis)
# - Frontend network for public access
# - All services non-root, read-only filesystems
# - Resource limits (CPU, memory)
# - Health checks on all services
# - Secrets from files (not environment variables)
# - No hardcoded credentials
# - TLS termination in Nginx
# ============================================================================
