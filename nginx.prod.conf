# ============================================================
# nginx config PRODUCTION — ERP FABS-CI V10
# Requiert : certbot / Let's Encrypt sur le host
# Certificats montés via volume Docker dans docker-compose.prod.yml
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name erp.fabsci.ci www.erp.fabsci.ci;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name erp.fabsci.ci www.erp.fabsci.ci;

    # Certificats Let's Encrypt (montés via volume)
    ssl_certificate     /etc/letsencrypt/live/erp.fabsci.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.fabsci.ci/privkey.pem;

    # TLS moderne uniquement
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (6 mois)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend (interne Docker)
    location /api {
        proxy_pass http://fabsci-backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Body size max 10MB
        client_max_body_size 10m;
    }

    # Cache static assets (1 an, immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bloquer accès aux fichiers sensibles
    location ~ /\. {
        deny all;
    }
}
