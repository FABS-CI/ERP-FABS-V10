services:
  # ============================================================================
  # Backend Service - FastAPI + Python
  # ============================================================================
  - type: web
    name: erp-fabs-backend
    env: docker
    dockerfilePath: ./Dockerfile.prod
    
    # ========================================================================
    # Render.com Configuration
    # ========================================================================
    repo: https://github.com/FABS-CI/ERP-FABS-V10.git
    branch: main
    
    # Deployment Strategy
    autoDeploy: true
    preDeployCommand: |
      # Database migrations (if needed)
      # python backend/migrate.py
      echo "Pre-deploy: Health check passed"
    
    # Service Configuration
    plan: standard
    region: oregon  # Geographically close to Ivory Coast users
    numInstances: 2
    
    # Health Check
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    # Port
    port: 8002
    
    # Environment Variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: "4"
      - key: WORKER_TIMEOUT
        value: "120"
      - key: FRONTEND_BUILD_DIR
        value: /app/frontend/dist
    
    # Secrets (reference from dashboard)
    envVarFiles:
      - file: .env.production
    
    # Auto-scaling
    autoscaling:
      enabled: true
      minInstances: 2
      maxInstances: 5
      targetCpuPercentage: 70
      targetMemoryPercentage: 75
    
    # Timeout
    startTimeout: 180

  # ============================================================================
  # PostgreSQL Database (for user sessions, audit logs)
  # ============================================================================
  - type: pserv
    name: erp-fabs-postgres
    ipAllowList: []  # Only allow from backend service
    
    plan: standard
    postgresMajorVersion: "16"
    
    # Backup Configuration
    enablePostgresIpAllowList: true
    enableDatadog: false
    
    region: oregon

  # ============================================================================
  # Redis Cache (for sessions, rate limiting, caching)
  # ============================================================================
  - type: pserv
    name: erp-fabs-redis
    
    plan: starter
    region: oregon
    
    # Use built-in Redis
    runtime: redis
    redisVersion: "7"

  # ============================================================================
  # MongoDB Deployment (via MongoDB Atlas)
  # Note: Configure via Render.com dashboard with MongoDB Atlas IP allowlist
  # ============================================================================
  # Connection string: MONGO_URI from environment

  # ============================================================================
  # Static Site (Frontend - optional CDN)
  # ============================================================================
  - type: static_site
    name: erp-fabs-frontend-cdn
    
    # Static files serve from backend's /app/frontend/dist
    # OR use Render's native static hosting for SPA
    # buildCommand: npm install && npm run build
    # publishDirectory: frontend/dist
    # branches:
    #   - branch: main
    #     autoDeploy: true

databases:
  - name: erp-fabs-postgres
    databaseName: erp_fabs_db
    user: erp_admin
    # Password: auto-generated by Render

  - name: erp-fabs-redis
    # Configuration via Render.com dashboard

# ============================================================================
# Routes & Networking
# ============================================================================
routes:
  # API routes proxy to backend
  - path: /api
    destination:
      name: erp-fabs-backend
  
  # Frontend static assets
  - path: /
    destination:
      name: erp-fabs-backend

# ============================================================================
# Cron Jobs (Optional - for automated tasks)
# ============================================================================
# cronJobs:
#   - name: backup-database
#     schedule: "0 2 * * *"  # 2 AM daily
#     command: python backend/backup.py
#   
#   - name: cleanup-sessions
#     schedule: "0 3 * * *"  # 3 AM daily
#     command: python backend/cleanup_sessions.py

# ============================================================================
# Alerts & Monitoring
# ============================================================================
notifications:
  # Slack notifications (configure in dashboard)
  - type: slack
    channel: "#erp-deployments"

  # Email notifications
  - type: email
    recipients:
      - pissken@editionsfabsci.com
      - ali.mamin@editionsfabsci.com
