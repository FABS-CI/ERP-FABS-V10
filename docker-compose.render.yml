version: '3.9'

# ============================================================================
# Docker Compose for LOCAL TESTING before Render.com deployment
# Production deployments use Render.com's native services (PostgreSQL, Redis)
# ============================================================================

services:
  # ============================================================================
  # Backend - FastAPI
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp-fabs-backend
    ports:
      - "8002:8002"
      - "9090:9090"  # Prometheus metrics
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DEBUG: "false"
      
      # Database
      DATABASE_URL: postgresql://erp_admin:erp_password@postgres:5432/erp_fabs_db
      MONGO_URI: mongodb://mongo:27017/erp_fabs_production
      REDIS_URL: redis://:redis_password@redis:6379/0
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # CORS
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,https://erp-fabs-backend.onrender.com
      
      # Email (SendGrid example - replace with your provider)
      SMTP_HOST: smtp.sendgrid.net
      SMTP_PORT: 587
      SMTP_USER: apikey
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: noreply@erp.fabs-ci.com
      
      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: eu-west-1
      AWS_S3_BUCKET: erp-fabs-ci-production
      
      # Monitoring
      PROMETHEUS_ENABLED: "true"
      GRAFANA_ENABLED: "true"
      
      # Session
      SESSION_TIMEOUT_MINUTES: 30
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      
      # Timezone
      TZ: Africa/Abidjan
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
      - /app/logs
      - /app/data
    
    networks:
      - erp-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    # Resource limits (adjust for Render.com plan)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: erp-fabs-postgres
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_fabs_db
      TZ: Africa/Abidjan
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d  # (if migrations exist)
    
    networks:
      - erp-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_fabs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

  # ============================================================================
  # MongoDB
  # ============================================================================
  mongo:
    image: mongo:7.0-alpine
    container_name: erp-fabs-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: erp_fabs_production
      TZ: Africa/Abidjan
    
    ports:
      - "27017:27017"
    
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    
    networks:
      - erp-network
    
    restart: unless-stopped
    
    command: mongod --auth

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: erp-fabs-redis
    
    command: redis-server --requirepass redis_password
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    networks:
      - erp-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

  # ============================================================================
  # Prometheus - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-fabs-prometheus
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    
    networks:
      - erp-network
    
    restart: unless-stopped
    
    depends_on:
      - backend

  # ============================================================================
  # Grafana - Dashboards & Monitoring
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: erp-fabs-grafana
    
    ports:
      - "3000:3000"
    
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - erp-network
    
    restart: unless-stopped
    
    depends_on:
      - prometheus

  # ============================================================================
  # AlertManager - Alert Routing
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: erp-fabs-alertmanager
    
    ports:
      - "9093:9093"
    
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    
    networks:
      - erp-network
    
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  mongo_data:
  mongo_config:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

# ============================================================================
# Networks
# ============================================================================
networks:
  erp-network:
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Start all services:
#    docker-compose -f docker-compose.render.yml up -d
#
# 2. Check status:
#    docker-compose -f docker-compose.render.yml ps
#
# 3. View logs:
#    docker-compose -f docker-compose.render.yml logs -f backend
#
# 4. Stop all services:
#    docker-compose -f docker-compose.render.yml down
#
# 5. Access services:
#    - API: http://localhost:8002
#    - Prometheus: http://localhost:9091
#    - Grafana: http://localhost:3000 (admin/admin)
#    - AlertManager: http://localhost:9093
#    - MongoDB: localhost:27017
#    - PostgreSQL: localhost:5432
#    - Redis: localhost:6379
#
# 6. Test API health:
#    curl http://localhost:8002/api/health
#
# ============================================================================
